name: Update animated profile cards
on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch actual activity and render SVGs
        run: python scripts/render_cards.py
      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile activity cards"
            git push
          fi

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Activity by month based on GitHub contributions"><rect width="900" height="300" rx="20" fill="#111923"/><rect x="1" y="1" width="898" height="298" rx="19" stroke="#263341" stroke-width="2" fill="none"/><style>
    text{font-family:Arial,Helvetica,sans-serif} .muted{fill:#95aaa6} .bright{fill:#e8f0ec}
    .enter{animation:appear .8s ease both} .spark{animation:spark 2s ease-in-out infinite}
    .sq{animation:appear .35s ease both} .bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
    @keyframes appear{from{opacity:0}to{opacity:1}} @keyframes grow{from{transform:scaleY(.03)}to{transform:scaleY(1)}}
    @keyframes spark{50%{opacity:.3}} @media(prefers-reduced-motion:reduce){.sq,.bar,.enter,.spark{animation:none!important}}
    </style><circle cx="27" cy="24" r="5" fill="#fa7474"/><circle cx="44" cy="24" r="5" fill="#e3b561"/><circle cx="61" cy="24" r="5" fill="#56e69b"/><text x="82" y="29" font-size="13" fill="#95aaa6">josselyn@github ~/ monthly_activity</text><text x="35" y="61" font-size="22" fill="#e8f0ec" font-weight="bold">Monthly activity</text><text x="35" y="82" font-size="13" fill="#95aaa6">Relative activity (GitHub intensity levels)</text><text x="69" y="263" text-anchor="middle" fill="#95aaa6" font-size="12">Dec</text><text x="136" y="263" text-anchor="middle" fill="#95aaa6" font-size="12">Jan</text><text x="203" y="263" text-anchor="middle" fill="#95aaa6" font-size="12">Feb</text><text x="270" y="263" text-anchor="middle" fill="#95aaa6" font-size="12">Mar</text><text x="337" y="263" text-anchor="middle" fill="#95aaa6" font-size="12">Apr</text><text x="404" y="263" text-anchor="middle" fill="#95aaa6" font-size="12">May</text><text x="471" y="263" text-anchor="middle" fill="#95aaa6" font-size="12">Jun</text><text x="538" y="263" text-anchor="middle" fill="#95aaa6" font-size="12">Jul</text><text x="605" y="263" text-anchor="middle" fill="#95aaa6" font-size="12">Aug</text><rect x="655" y="199" width="34" height="41" rx="5" fill="#29b87d" class="bar" style="animation-delay:0.72s"/><text x="672" y="263" text-anchor="middle" fill="#95aaa6" font-size="12">Sep</text><text x="739" y="263" text-anchor="middle" fill="#95aaa6" font-size="12">Oct</text><rect x="789" y="110" width="34" height="130" rx="5" fill="#56e69b" class="bar" style="animation-delay:0.88s"/><text x="806" y="263" text-anchor="middle" fill="#95aaa6" font-size="12">Nov</text><line x1="42" x2="852" y1="240" y2="240" stroke="#263341"/></svg>